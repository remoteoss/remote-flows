# Marks example/ as its own pnpm root, independent from the SDK at the repo root.
# Without this, pnpm walks up, finds the root pnpm-workspace.yaml and treats the
# whole repo as one workspace — example/ (not a listed package) would then be
# skipped on install. example/ consumes the SDK via `link:..` (a permanent
# symlink to the working tree, same behavior as `file:..` under npm), so the SDK
# must be built (`pnpm build` / `pnpm dev` at the repo root) for example/ to
# type-check and run.
#
# No `packages:` key → not a workspace, just a settings/root marker.
allowBuilds:
  # Native file watcher: the prebuilt platform binary ships via an optional
  # dependency (@parcel/watcher-<platform>), so the node-gyp build is not needed.
  '@parcel/watcher': false
