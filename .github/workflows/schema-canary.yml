name: Schema Canary

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: schema-canary-${{ github.event_name == 'merge_group' && 'merge-queue' || 'main' }}
  queue: max

jobs:
  main-canary:
    if: github.event_name != 'merge_group'
    name: Contract Details Schema Canary (main)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run schema canary against sandbox
        id: canary
        timeout-minutes: 25
        env:
          VITE_CLIENT_ID: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          REMOTE_CLIENT_SECRET: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          REMOTE_REFRESH_TOKEN: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}
        run: pnpm run schema-canary --write --failures-out="$RUNNER_TEMP/schema-canary-failures.md" --keep-submitted="$RUNNER_TEMP/kept-employments.json"

      - name: Check which employments were kept
        id: kept
        if: ${{ !cancelled() }}
        run: |
          if [ -s "$RUNNER_TEMP/kept-employments.json" ] && [ "$(jq length "$RUNNER_TEMP/kept-employments.json")" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-submit contract details in the browser
        id: browser
        if: ${{ !cancelled() && steps.kept.outputs.any == 'true' }}
        uses: ./.github/actions/schema-canary-browser
        with:
          employments-file: ${{ runner.temp }}/kept-employments.json
          client-id: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          client-secret: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          refresh-token: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}

      - name: Archive the kept employments
        if: always()
        env:
          VITE_CLIENT_ID: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          REMOTE_CLIENT_SECRET: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          REMOTE_REFRESH_TOKEN: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}
        run: |
          if [ -f "$RUNNER_TEMP/kept-employments.json" ]; then
            pnpm run schema-canary:archive --from="$RUNNER_TEMP/kept-employments.json"
          fi

      - name: Count failing checks in the report
        id: count
        if: always()
        run: |
          failing=$(jq '[.checks[] | select(.outcome == "fail" or .outcome == "seed-error")] | length' scripts/reports/schema-canary.json)
          if [ "$failing" -gt 0 ]; then
            echo "title=chore(schema-canary): update contract details schema canary report ($failing failing)" >> "$GITHUB_OUTPUT"
          else
            echo "title=chore(schema-canary): update contract details schema canary report (all passing)" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a GitHub App token for the report pull request
        id: app-token
        if: always()
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SCHEMA_CANARY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCHEMA_CANARY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Skip the pull request if main already has this report
        id: stale
        if: always()
        run: |
          git fetch --depth=1 origin main
          if git diff --quiet origin/main -- scripts/reports/schema-canary.json; then
            echo "same=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request with the updated report
        if: always() && steps.app-token.outcome == 'success' && steps.stale.outputs.same != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore(schema-canary): update contract details schema canary report'
          branch: chore/schema-canary-report-auto
          delete-branch: true
          title: ${{ steps.count.outputs.title }}
          body: 'Automated run of `pnpm run schema-canary` on main. See the workflow run summary for the full pass/fail table.'
          add-paths: |
            scripts/reports/schema-canary.json

      - name: Open or update the failure issue
        if: failure() && (steps.canary.outcome == 'failure' || steps.browser.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          {
            echo "The contract details schema canary on main is failing against sandbox."
            echo
            if [ "$BROWSER_OUTCOME" = "failure" ]; then
              echo "The browser stage failed: re-submitting contract details in the example app did not match what the canary saved. The Playwright report is attached to the run."
              echo
            fi
            if [ -s "$RUNNER_TEMP/schema-canary-failures.md" ]; then
              cat "$RUNNER_TEMP/schema-canary-failures.md"
            elif [ "$BROWSER_OUTCOME" != "failure" ]; then
              echo "The canary stopped before it checked any country, for example because sandbox auth failed. The run log has the error."
            fi
          } > "$RUNNER_TEMP/issue-body.md"
          gh label create schema-canary --color B60205 --description "Schema canary failures on main" --force
          number=$(gh issue list --label schema-canary --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            number=$(gh issue create --title "Schema canary is failing" --label schema-canary --body-file "$RUNNER_TEMP/issue-body.md" | grep -oE '[0-9]+$')
            gh issue comment "$number" --body "Failing run: $RUN_URL"
          elif [ "$(gh issue view "$number" --json body --jq .body)" != "$(cat "$RUNNER_TEMP/issue-body.md")" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/issue-body.md"
            gh issue comment "$number" --body "The failures changed. Failing run: $RUN_URL"
          fi

      - name: Close the failure issue
        if: always() && steps.canary.outcome == 'success' && contains(fromJSON('["success", "skipped"]'), steps.browser.outcome)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --label schema-canary --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Back to green: $RUN_URL"
          done

  pr-canary:
    if: github.event_name == 'merge_group'
    name: Contract Details Schema Canary (pinned, merge queue)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Pick the countries to check
        id: scope
        run: echo "countries=$(pnpm exec tsx scripts/schema-canary/changed-countries.ts)" >> "$GITHUB_OUTPUT"

      - name: Run schema canary (pinned and submit checks) against sandbox
        timeout-minutes: 15
        if: steps.scope.outputs.countries != 'none'
        env:
          VITE_CLIENT_ID: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          REMOTE_CLIENT_SECRET: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          REMOTE_REFRESH_TOKEN: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}
          COUNTRIES: ${{ steps.scope.outputs.countries }}
        run: |
          if [ "$COUNTRIES" = "all" ]; then
            pnpm run schema-canary --checks=pinned,submit --keep-submitted="$RUNNER_TEMP/kept-employments.json"
          else
            pnpm run schema-canary --checks=pinned,submit --country="$COUNTRIES" --keep-submitted="$RUNNER_TEMP/kept-employments.json"
          fi

      - name: Check which employments were kept
        id: kept
        if: ${{ !cancelled() }}
        run: |
          if [ -s "$RUNNER_TEMP/kept-employments.json" ] && [ "$(jq length "$RUNNER_TEMP/kept-employments.json")" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-submit contract details in the browser
        id: browser
        if: ${{ !cancelled() && steps.kept.outputs.any == 'true' }}
        uses: ./.github/actions/schema-canary-browser
        with:
          employments-file: ${{ runner.temp }}/kept-employments.json
          client-id: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          client-secret: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          refresh-token: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}

      - name: Archive the kept employments
        if: always()
        env:
          VITE_CLIENT_ID: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          REMOTE_CLIENT_SECRET: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          REMOTE_REFRESH_TOKEN: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}
        run: |
          if [ -f "$RUNNER_TEMP/kept-employments.json" ]; then
            pnpm run schema-canary:archive --from="$RUNNER_TEMP/kept-employments.json"
          fi
