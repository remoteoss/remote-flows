name: Schema Canary

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'example/src/flows/Onboarding/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/common/createHeadlessForm.tsx'
      - 'src/common/headlessForm.ts'
      - 'src/components/form/utils.ts'
      - 'src/flows/Onboarding/utils.ts'
      - 'scripts/contract-details-seeds.ts'
      - 'scripts/fill-schema.ts'
      - 'scripts/schema-canary.ts'
      - 'scripts/schema-canary/**'
      - 'scripts/schema-canary-archive.ts'
      - 'scripts/schema-canary-affected.ts'
      - 'example/e2e/canary/**'
      - 'example/playwright.canary.config.ts'
      - '.github/actions/schema-canary-browser/**'
      - '.github/workflows/schema-canary.yml'

jobs:
  nightly-canary:
    if: github.event_name != 'pull_request'
    name: Contract Details Schema Canary (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'

      - name: Install dependencies
        run: npm ci --include=optional --ignore-scripts

      - name: Run schema canary against sandbox
        id: canary
        env:
          VITE_CLIENT_ID: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          VITE_CLIENT_SECRET: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          VITE_REFRESH_TOKEN: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}
        run: npm run schema-canary -- --write --failures-out="$RUNNER_TEMP/schema-canary-failures.md" --keep-submitted="$RUNNER_TEMP/kept-employments.json"

      - name: Check which employments were kept
        id: kept
        if: ${{ !cancelled() }}
        run: |
          if [ -s "$RUNNER_TEMP/kept-employments.json" ] && [ "$(jq length "$RUNNER_TEMP/kept-employments.json")" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-submit contract details in the browser
        id: browser
        if: ${{ !cancelled() && steps.kept.outputs.any == 'true' }}
        uses: ./.github/actions/schema-canary-browser
        with:
          employments-file: ${{ runner.temp }}/kept-employments.json
          client-id: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          client-secret: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          refresh-token: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}

      - name: Archive the kept employments
        if: always()
        env:
          VITE_CLIENT_ID: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          VITE_CLIENT_SECRET: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          VITE_REFRESH_TOKEN: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}
        run: |
          if [ -f "$RUNNER_TEMP/kept-employments.json" ]; then
            npm run schema-canary:archive -- --from="$RUNNER_TEMP/kept-employments.json"
          fi

      - name: Count failing checks in the report
        id: count
        if: always()
        run: |
          failing=$(jq '[.checks[] | select(.outcome == "fail" or .outcome == "seed-error")] | length' scripts/reports/schema-canary.json)
          if [ "$failing" -gt 0 ]; then
            echo "title=chore(schema-canary): update contract details schema canary report ($failing failing)" >> "$GITHUB_OUTPUT"
          else
            echo "title=chore(schema-canary): update contract details schema canary report (all passing)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request with the updated report
        if: always()
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'chore(schema-canary): update contract details schema canary report'
          branch: chore/schema-canary-report-auto
          delete-branch: true
          title: ${{ steps.count.outputs.title }}
          body: 'Automated nightly run of `npm run schema-canary`. See the workflow run summary for the full pass/fail table.'
          add-paths: |
            scripts/reports/schema-canary.json

      - name: Open or update the failure issue
        if: failure() && (steps.canary.outcome == 'failure' || steps.browser.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          {
            echo "The nightly contract details schema canary is failing against sandbox."
            echo
            if [ "$BROWSER_OUTCOME" = "failure" ]; then
              echo "The browser stage failed: re-submitting contract details in the example app did not match what the canary saved. The Playwright report is attached to the run."
              echo
            fi
            if [ -s "$RUNNER_TEMP/schema-canary-failures.md" ]; then
              cat "$RUNNER_TEMP/schema-canary-failures.md"
            elif [ "$BROWSER_OUTCOME" != "failure" ]; then
              echo "The canary stopped before it checked any country, for example because sandbox auth failed. The run log has the error."
            fi
          } > "$RUNNER_TEMP/issue-body.md"
          gh label create schema-canary --color B60205 --description "Nightly schema canary failures" --force
          number=$(gh issue list --label schema-canary --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            number=$(gh issue create --title "Schema canary is failing" --label schema-canary --body-file "$RUNNER_TEMP/issue-body.md" | grep -oE '[0-9]+$')
            gh issue comment "$number" --body "Failing run: $RUN_URL"
          elif [ "$(gh issue view "$number" --json body --jq .body)" != "$(cat "$RUNNER_TEMP/issue-body.md")" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/issue-body.md"
            gh issue comment "$number" --body "The failures changed. Failing run: $RUN_URL"
          fi

      - name: Close the failure issue
        if: always() && steps.canary.outcome == 'success' && contains(fromJSON('["success", "skipped"]'), steps.browser.outcome)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --label schema-canary --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Back to green: $RUN_URL"
          done

  pr-canary:
    if: github.event_name == 'pull_request'
    name: Contract Details Schema Canary (pinned, PR)
    runs-on: ubuntu-latest
    concurrency:
      group: schema-canary-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'

      - name: Install dependencies
        run: npm ci --include=optional --ignore-scripts

      - name: Find the countries this PR affects
        id: affected
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run -s schema-canary:affected -- --base="origin/$BASE_REF"

      - name: Run schema canary (pinned and submit checks) against sandbox
        if: steps.affected.outputs.countries != ''
        env:
          COUNTRIES: ${{ steps.affected.outputs.countries }}
          VITE_CLIENT_ID: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          VITE_CLIENT_SECRET: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          VITE_REFRESH_TOKEN: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}
        run: |
          if [ "$COUNTRIES" = "all" ]; then
            npm run schema-canary -- --checks=pinned,submit --keep-submitted="$RUNNER_TEMP/kept-employments.json"
          else
            npm run schema-canary -- --checks=pinned,submit --keep-submitted="$RUNNER_TEMP/kept-employments.json" --country="$COUNTRIES"
          fi

      - name: Check which employments were kept
        id: kept
        if: ${{ !cancelled() }}
        run: |
          if [ -s "$RUNNER_TEMP/kept-employments.json" ] && [ "$(jq length "$RUNNER_TEMP/kept-employments.json")" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-submit contract details in the browser
        id: browser
        if: ${{ !cancelled() && steps.kept.outputs.any == 'true' }}
        uses: ./.github/actions/schema-canary-browser
        with:
          employments-file: ${{ runner.temp }}/kept-employments.json
          client-id: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          client-secret: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          refresh-token: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}

      - name: Archive the kept employments
        if: always()
        env:
          VITE_CLIENT_ID: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          VITE_CLIENT_SECRET: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          VITE_REFRESH_TOKEN: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}
        run: |
          if [ -f "$RUNNER_TEMP/kept-employments.json" ]; then
            npm run schema-canary:archive -- --from="$RUNNER_TEMP/kept-employments.json"
          fi
