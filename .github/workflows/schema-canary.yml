name: Schema Canary

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'example/src/flows/Onboarding/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/common/createHeadlessForm.tsx'
      - 'src/common/headlessForm.ts'
      - 'src/components/form/utils.ts'
      - 'src/flows/Onboarding/utils.ts'
      - 'scripts/contract-details-seeds.ts'
      - 'scripts/fill-schema.ts'
      - 'scripts/schema-canary.ts'
      - 'scripts/schema-canary/**'
      - 'scripts/schema-canary-archive.ts'
      - 'scripts/schema-canary-browser-report.ts'
      - 'example/e2e/canary/**'
      - 'example/playwright.canary.config.ts'
      - '.github/actions/schema-canary-browser/**'
      - '.github/workflows/schema-canary.yml'

jobs:
  main-canary:
    if: github.event_name != 'pull_request'
    name: Contract Details Schema Canary (main)
    runs-on: ubuntu-latest
    concurrency:
      group: schema-canary
      queue: max
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CHECK_LATEST: ${{ github.event_name != 'push' }}
      NOTIFY: '@gabrielseco'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'

      - name: Install dependencies
        run: npm ci --include=optional --ignore-scripts

      - name: Run schema canary against sandbox
        id: canary
        timeout-minutes: 25
        env:
          VITE_CLIENT_ID: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          VITE_CLIENT_SECRET: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          VITE_REFRESH_TOKEN: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}
        run: npm run schema-canary -- --versions="$([ "$CHECK_LATEST" = true ] && echo pinned,latest || echo pinned)" --write --failures-out="$RUNNER_TEMP/pinned-failures.md" --latest-failures-out="$RUNNER_TEMP/latest-failures.md" --keep-submitted="$RUNNER_TEMP/kept-employments.json"

      - name: Check which employments were kept
        id: kept
        run: |
          if [ -s "$RUNNER_TEMP/kept-employments.json" ] && [ "$(jq length "$RUNNER_TEMP/kept-employments.json")" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-submit contract details in the browser
        id: browser-run
        if: steps.kept.outputs.any == 'true'
        uses: ./.github/actions/schema-canary-browser
        with:
          employments-file: ${{ runner.temp }}/kept-employments.json
          results-file: ${{ runner.temp }}/browser-results.json
          rerun-results-file: ${{ runner.temp }}/browser-rerun-results.json
          client-id: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          client-secret: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          refresh-token: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}

      - name: Add the browser results to the report
        id: browser
        if: ${{ !cancelled() && steps.kept.outputs.any == 'true' }}
        run: npm run schema-canary:browser-report -- --kept="$RUNNER_TEMP/kept-employments.json" --results="$RUNNER_TEMP/browser-results.json,$RUNNER_TEMP/browser-rerun-results.json" --write --failures-out="$RUNNER_TEMP/pinned-failures.md" --latest-failures-out="$RUNNER_TEMP/latest-failures.md"

      - name: Archive the kept employments
        if: always()
        env:
          VITE_CLIENT_ID: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          VITE_CLIENT_SECRET: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          VITE_REFRESH_TOKEN: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}
        run: |
          if [ -f "$RUNNER_TEMP/kept-employments.json" ]; then
            npm run schema-canary:archive -- --from="$RUNNER_TEMP/kept-employments.json"
          fi

      - name: Count failing checks in the report
        id: count
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: |
          count() {
            jq "[.checks[] | select(.version $1 \"latest\" and (.outcome == \"fail\" or .outcome == \"seed-error\"))] | length" scripts/reports/schema-canary.json
          }
          pinned=$(count '!=')
          latest=$(count '==')
          if [ "$pinned" -gt 0 ] || [ "$latest" -gt 0 ]; then
            echo "title=chore(schema-canary): update contract details schema canary report ($pinned pinned failing, $latest latest failing)" >> "$GITHUB_OUTPUT"
          else
            echo "title=chore(schema-canary): update contract details schema canary report (all passing)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request with the updated report
        if: ${{ !cancelled() && github.event_name != 'push' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'chore(schema-canary): update contract details schema canary report'
          branch: chore/schema-canary-report-auto
          delete-branch: true
          title: ${{ steps.count.outputs.title }}
          body: 'Automated run of `npm run schema-canary` on main. See the workflow run summary for the full pass/fail table.'
          add-paths: |
            scripts/reports/schema-canary.json

      - name: Open, update or close the failure issues
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
          BROWSER_RUN_OUTCOME: ${{ steps.browser-run.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          BROWSER_COMPLETE: ${{ steps.browser.outputs.complete }}
        run: |
          is_success_or_skipped() { [ "$1" = success ] || [ "$1" = skipped ]; }
          checked_pinned=false
          if [ "$CANARY_OUTCOME" = success ] && is_success_or_skipped "$BROWSER_RUN_OUTCOME" && is_success_or_skipped "$BROWSER_OUTCOME"; then
            checked_pinned=true
          fi
          checked_latest=false
          if [ "$CANARY_OUTCOME" = success ] && { [ "$BROWSER_OUTCOME" = skipped ] || [ "$BROWSER_COMPLETE" = true ]; }; then
            checked_latest=true
          fi

          table_rows() { grep '^| ' "$1" | grep -v -e '^| Country |' -e '^| --- |' | sort -u; }
          table_diff() {
            local heading=$1 side=$2 rows
            rows=$(comm "$side" <(table_rows "$3") <(table_rows "$4"))
            [ -z "$rows" ] && return
            printf '\n### %s\n\n| Country | Version | Strategy | Check | Result | Error |\n| --- | --- | --- | --- | --- | --- |\n%s\n' "$heading" "$rows"
          }

          sync_issue() {
            local label=$1 title=$2 failing=$3 body_file=$4 checked=$5 number
            gh label create "$label" --color B60205 --description "$title" --force
            number=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
            if [ "$failing" = true ]; then
              if [ -z "$number" ]; then
                number=$(gh issue create --title "$title" --label "$label" --body-file "$body_file" | grep -oE '[0-9]+$')
                gh issue comment "$number" --body "$NOTIFY this started failing. Failing run: $RUN_URL"
              else
                gh issue view "$number" --json body --jq .body > "$RUNNER_TEMP/old-body.md"
                if [ "$(cat "$RUNNER_TEMP/old-body.md")" != "$(cat "$body_file")" ]; then
                  gh issue edit "$number" --body-file "$body_file"
                  {
                    echo "$NOTIFY the failures changed. Failing run: $RUN_URL"
                    table_diff "Started failing" -13 "$RUNNER_TEMP/old-body.md" "$body_file"
                    table_diff "Fixed" -23 "$RUNNER_TEMP/old-body.md" "$body_file"
                  } > "$RUNNER_TEMP/change-comment.md"
                  gh issue comment "$number" --body-file "$RUNNER_TEMP/change-comment.md"
                fi
              fi
            elif [ "$checked" = true ]; then
              for open in $(gh issue list --label "$label" --state open --json number --jq '.[].number'); do
                gh issue close "$open" --comment "$NOTIFY back to green: $RUN_URL"
              done
            fi
          }

          pinned_failing=false
          if [ "$CANARY_OUTCOME" = failure ] || [ "$BROWSER_RUN_OUTCOME" = failure ] || [ "$BROWSER_OUTCOME" = failure ]; then
            pinned_failing=true
          fi
          {
            echo "The nightly contract details schema canary is failing against sandbox on the pinned versions partners use today."
            echo
            echo "What each failure means and what to do: [schema canary guide](https://github.com/remoteoss/remote-flows/blob/main/docs/SCHEMA_CANARY.md)"
            echo
            if [ -s "$RUNNER_TEMP/pinned-failures.md" ]; then
              cat "$RUNNER_TEMP/pinned-failures.md"
            elif [ "$BROWSER_RUN_OUTCOME" = failure ]; then
              echo "The browser stage could not run. The run log has the error."
            else
              echo "The canary stopped before it checked any country, for example because sandbox auth failed. The run log has the error."
            fi
          } > "$RUNNER_TEMP/pinned-issue.md"
          sync_issue schema-canary "Schema canary is failing" "$pinned_failing" "$RUNNER_TEMP/pinned-issue.md" "$checked_pinned"

          latest_failing=false
          if [ -s "$RUNNER_TEMP/latest-failures.md" ]; then
            latest_failing=true
          fi
          {
            echo "These countries fail the nightly contract details schema canary on the latest version sandbox serves. Partners are not affected yet, but these countries can't move their pinned version to latest until this is fixed."
            echo
            echo "What each failure means and what to do: [schema canary guide](https://github.com/remoteoss/remote-flows/blob/main/docs/SCHEMA_CANARY.md)"
            echo
            cat "$RUNNER_TEMP/latest-failures.md" 2>/dev/null
          } > "$RUNNER_TEMP/latest-issue.md"
          if [ "$CHECK_LATEST" = true ] && [ "$BROWSER_RUN_OUTCOME" != failure ]; then
            sync_issue schema-canary-latest "Schema canary is failing on the latest versions" "$latest_failing" "$RUNNER_TEMP/latest-issue.md" "$checked_latest"
          fi

  pr-canary:
    if: github.event_name == 'pull_request'
    name: Contract Details Schema Canary (pinned, PR)
    runs-on: ubuntu-latest
    concurrency:
      group: schema-canary-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'

      - name: Install dependencies
        run: npm ci --include=optional --ignore-scripts

      - name: Run schema canary (pinned versions) against sandbox
        timeout-minutes: 15
        env:
          VITE_CLIENT_ID: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          VITE_CLIENT_SECRET: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          VITE_REFRESH_TOKEN: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}
        run: npm run schema-canary -- --versions=pinned --keep-submitted="$RUNNER_TEMP/kept-employments.json"

      - name: Check which employments were kept
        id: kept
        run: |
          if [ -s "$RUNNER_TEMP/kept-employments.json" ] && [ "$(jq length "$RUNNER_TEMP/kept-employments.json")" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-submit contract details in the browser
        if: steps.kept.outputs.any == 'true'
        uses: ./.github/actions/schema-canary-browser
        with:
          employments-file: ${{ runner.temp }}/kept-employments.json
          results-file: ${{ runner.temp }}/browser-results.json
          rerun-results-file: ${{ runner.temp }}/browser-rerun-results.json
          client-id: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          client-secret: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          refresh-token: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}

      - name: Check the browser results
        if: ${{ !cancelled() && steps.kept.outputs.any == 'true' }}
        run: npm run schema-canary:browser-report -- --kept="$RUNNER_TEMP/kept-employments.json" --results="$RUNNER_TEMP/browser-results.json,$RUNNER_TEMP/browser-rerun-results.json"

      - name: Archive the kept employments
        if: always()
        env:
          VITE_CLIENT_ID: ${{ secrets.SCHEMA_CANARY_CLIENT_ID }}
          VITE_CLIENT_SECRET: ${{ secrets.SCHEMA_CANARY_CLIENT_SECRET }}
          VITE_REFRESH_TOKEN: ${{ secrets.SCHEMA_CANARY_REFRESH_TOKEN }}
        run: |
          if [ -f "$RUNNER_TEMP/kept-employments.json" ]; then
            npm run schema-canary:archive -- --from="$RUNNER_TEMP/kept-employments.json"
          fi
