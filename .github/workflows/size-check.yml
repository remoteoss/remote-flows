name: Bundle Size Check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsdown.config.ts'
      - '.sizelimit.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size-check:
    runs-on: ubuntu-latest
    name: Check bundle size

    steps:
      - name: Checkout PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build current branch
        run: pnpm run build

      - name: Analyze current bundle size
        run: pnpm run size --output out/current-bundle.json

      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false

      - name: Check if comparison script exists on base
        id: check_script
        run: |
          if [ -f "base/scripts/compare-sizes.ts" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Comparison script not found on base branch. Skipping size comparison."
          fi

      - name: Install dependencies (base)
        if: steps.check_script.outputs.exists == 'true'
        working-directory: base
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile --ignore-scripts
          else
            npm ci --include=optional --ignore-scripts
          fi

      - name: Build base branch
        if: steps.check_script.outputs.exists == 'true'
        working-directory: base
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run build
          else
            npm run build
          fi

      - name: Analyze base bundle size
        if: steps.check_script.outputs.exists == 'true'
        working-directory: base
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run size --output ../out/base-bundle.json
          else
            npm run size -- --output ../out/base-bundle.json
          fi

      - name: Compare bundle sizes
        id: compare
        run: |
          # Check if we have comparison data
          if [ "${STEPS_CHECK_SCRIPT_OUTPUTS_EXISTS}" != "true" ]; then
            echo "⚠️ Comparison script not found in base branch. Showing current bundle size only."
            pnpm exec tsx scripts/format-current-size.ts out/current-bundle.json > out/size-report.md
          else
            # Run comparison and capture output
            pnpm exec tsx scripts/compare-sizes.ts out/base-bundle.json out/current-bundle.json > out/size-report.md 2>&1 || true
          fi

          # Read the report for the PR comment
          REPORT=$(cat out/size-report.md)

          # Set output for PR comment (escape for GitHub Actions)
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          STEPS_CHECK_SCRIPT_OUTPUTS_EXISTS: ${{ steps.check_script.outputs.exists }}

      - name: Post PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = process.env.SIZE_REPORT;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📦 Bundle Size Report')
            );

            const commentBody = report;

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
        env:
          SIZE_REPORT: ${{ steps.compare.outputs.report }}

      - name: Check size limits
        run: pnpm run size:check

      - name: Upload bundle analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bundle-size-analysis
          path: |
            out/current-bundle.json
            out/base-bundle.json
            out/size-report.md
          retention-days: 30
