name: E2E Nightly

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy-nightly:
    name: Deploy Nightly Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Deploy to Vercel
        id: vercel-deploy
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_REMOTE_FLOWS_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Save deployment URL
        env:
          PREVIEW_URL: ${{ steps.vercel-deploy.outputs.preview-url }}
        run: |
          echo "$PREVIEW_URL" > remote-flows-url.txt

      - name: Upload deployment URL
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: remote-flows-url
          path: remote-flows-url.txt

  e2e-tests-production:
    name: E2E Tests (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-nightly
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox] # no webkit support for now, as tests are failing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'

      - name: Install main package dependencies
        run: npm ci --include=optional --ignore-scripts

      - name: Install example/ dependencies
        working-directory: ./example
        run: npm ci --include=optional --ignore-scripts

      - name: Get Playwright version
        id: playwright-version
        working-directory: ./example
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright system dependencies first
        working-directory: ./example
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libdbus-1-3 libxkbcommon0 libatspi2.0-0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2 libwayland-client0

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./example
        timeout-minutes: 5
        run: |
          # Retry up to 3 times with exponential backoff
          for i in 1 2 3; do
            echo "Attempt $i of 3"
            if npx playwright install ${{ matrix.browser }}; then
              echo "Successfully installed Playwright browsers"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Installation failed, waiting $((i * 10)) seconds before retry..."
              sleep $((i * 10))
            fi
          done
          echo "Failed to install Playwright browsers after 3 attempts"
          exit 1

      - name: Download remote-flows URL
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: remote-flows-url

      - name: Set deployment URL
        id: set-url
        run: |
          echo "REMOTE_FLOWS_URL=$(cat remote-flows-url.txt)" >> $GITHUB_ENV

      - name: Run Playwright tests
        id: playwright-tests
        env:
          BASE_URL: ${{ env.REMOTE_FLOWS_URL }}
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
          DEBUG: pw:api
        working-directory: ./example
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: example/playwright-report/
          retention-days: 30

  create-issue-on-failure:
    name: Create Issue on Failure
    runs-on: ubuntu-latest
    needs: [deploy-nightly, e2e-tests-production]
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create Issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly E2E Workflow Failed - ${new Date().toISOString().split('T')[0]}`,
              body: `## Nightly E2E Workflow Failure\n\n**Workflow Run:** ${runUrl}\n\n**Date:** ${new Date().toISOString()}\n\n**Note:** This could be a deployment failure, test failure, or an infrastructure issue (npm install, browser setup, etc.). Please review the workflow logs and Playwright reports in the artifacts.`,
              assignees: ['gabrielseco', 'jordividaller', 'cammellos']
            });
            console.log(`Created issue #${issue.data.number}`);
