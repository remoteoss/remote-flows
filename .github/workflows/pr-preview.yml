name: PR Preview Package

on:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ (github.event.action == 'synchronize' || github.event.label.name == 'preview-pkg') && 'build' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Publish preview package
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview-pkg') &&
      (github.event.action == 'synchronize' || github.event.label.name == 'preview-pkg')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      - name: Publish preview package
        run: pnpm dlx pkg-pr-new@0.0.93 publish --pnpm --compact
