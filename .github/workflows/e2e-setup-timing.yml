name: E2E Setup Timing Experiment

on:
  push:
    branches:
      - experiment/e2e-setup-timing

permissions: {}

jobs:
  apt-install-deps:
    name: apt ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Install Playwright CLI
        run: npm install --global playwright@1.63.0

      - name: Install Playwright system dependencies
        run: playwright install-deps chromium

  playwright-container:
    name: container ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Container ready
        run: npx --version
